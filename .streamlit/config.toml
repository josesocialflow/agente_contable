# Tema del panel del agente de cuentas por pagar.
#
# Streamlit lee este fichero cuando se lanza `streamlit run app.py` desde esta
# carpeta (busca `.streamlit/config.toml` en el directorio de trabajo).
#
# Paleta oscura pero no negra: un azul pizarra de fondo, blanco roto para el
# texto y un único acento azul acero para lo interactivo (botones, controles,
# foco, etiqueta activa). Los colores de estado no se fuerzan: las insignias
# usan los semánticos de Streamlit (naranja pendiente, verde registrada, rojo
# rechazada), que es lo que hace legible la cola de un vistazo.
#
# Los colores no son arbitrarios: el texto queda en torno a 14:1 de contraste
# sobre el fondo y el acento por encima de 5:1, así que se lee bien proyectado
# sin resultar chillón.

[theme]
base = "dark"
primaryColor = "#4A90C2"               # azul acero: marca e interacción
backgroundColor = "#0F1620"            # lienzo: azul muy oscuro, no negro puro
secondaryBackgroundColor = "#17202B"   # barra lateral, tarjetas y controles
textColor = "#DDE3EA"                  # blanco roto: menos fatiga que #FFFFFF
borderColor = "#26313E"                # bordes de tarjetas, tablas y divisores
dataframeHeaderBackgroundColor = "#1D2835"
linkColor = "#7CB6DD"                  # enlaces: versión clara del acento
font = "sans serif"
# Esquinas menos redondeadas: aspecto de herramienta interna, no de juguete.
baseRadius = "small"

# Valores del tema claro anterior, por si quieres volver atrás:
# base = "light"
# primaryColor = "#1F4E79"
# backgroundColor = "#FFFFFF"
# secondaryBackgroundColor = "#F4F6F8"
# textColor = "#1A1D21"

[client]
# Oculta "Deploy" y el menú de desarrollo: menos ruido en la grabación.
toolbarMode = "minimal"
